name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography UnityPy lz4 brotli texture2ddecoder pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --name DJMAX-PPL `
            --collect-all UnityPy --collect-all cryptography --collect-all lz4 `
            --hidden-import brotli --hidden-import texture2ddecoder `
            main.py

      - name: Report artifact size
        shell: pwsh
        run: |
          $exe = Get-Item "dist/DJMAX-PPL.exe"
          "artifact: {0} ({1:N1} MB)" -f $exe.Name, ($exe.Length / 1MB)

      - name: Smoke test
        run: |
          .\dist\DJMAX-PPL.exe --help

      - uses: actions/upload-artifact@v4
        with:
          name: DJMAX-PPL-windows-x64
          path: dist/DJMAX-PPL.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/DJMAX-PPL.exe" --generate-notes
